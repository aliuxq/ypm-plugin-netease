# 打 tag（形如 v1.0.0）时，把插件运行所需文件打包成 zip 上传到 Release，
# 方便用户通过「安装插件 → 粘贴 github.com/<用户名>/ypm-plugin-netease」一键安装。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package plugin
        run: |
          mkdir -p dist
          zip -r "dist/ypm-plugin-netease-${{ github.ref_name }}.zip" \
            plugin.json index.js client.js models.js i18n.js icon.png locales \
            -x '*.DS_Store'

      # Release 正文取自 CHANGELOG.md 里本版本那一段，而不是 GitHub 自动生成的
      # 一行 compare 链接（那样发布页上看不到更新内容）。
      - name: Extract changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v head="## v${ver}" 'index($0, head) == 1 { on = 1; next } on && /^## v/ { exit } on' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "本版本暂无更新日志，详见 [CHANGELOG.md](../blob/main/CHANGELOG.md)。" > dist/notes.md
          fi
          echo "--- 发布正文预览 ---"
          head -5 dist/notes.md

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: dist/notes.md
